<!doctype html><html><head><meta charset="utf-8"><title>b3</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:#fff;font:14px sans-serif}
canvas,video{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;left:0;right:0;top:40%;text-align:center;font:bold 32px sans-serif;color:#fff;text-shadow:0 0 6px #000;pointer-events:none;z-index:3}
#hud{position:absolute;left:4px;top:4px;font:12px monospace;background:#0008;padding:2px 4px;z-index:5}
.layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;font:12px sans-serif}
.layer span{display:inline-block;animation:wob 1.3s ease-in-out infinite alternate}
@keyframes wob{from{letter-spacing:0;color:#ff0;margin-left:0}to{letter-spacing:3px;color:#0ff;margin-left:6px}}
</style></head><body><div id="hud"></div><script src="app.js"></script></body></html>
